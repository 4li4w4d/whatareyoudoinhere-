<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>what are you doin here?</title>
    <style>
      :root {
        --bg1: #130d1a;
        --bg2: #26162d;
        --panel: rgba(255, 255, 255, 0.08);
        --text: #f7f1ff;
        --pink: #ff7ad9;
        --purple: #a78bfa;
        --lime: #b7ff6c;
        --cyan: #67f6ff;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background:
          radial-gradient(circle at top left, rgba(255, 122, 217, 0.18), transparent 30%),
          radial-gradient(circle at bottom right, rgba(103, 246, 255, 0.18), transparent 35%),
          linear-gradient(135deg, var(--bg1), var(--bg2));
        color: var(--text);
        display: grid;
        place-items: center;
        overflow: hidden;
      }

      .scene {
        position: relative;
        width: min(92vw, 860px);
        padding: 32px;
        border: 1px solid rgba(255,255,255,0.12);
        background: var(--panel);
        backdrop-filter: blur(10px);
        border-radius: 28px;
        box-shadow: 0 30px 80px rgba(0,0,0,0.45);
      }

      .badge {
        display: inline-block;
        margin-bottom: 18px;
        padding: 8px 14px;
        border-radius: 999px;
        background: rgba(183, 255, 108, 0.14);
        border: 1px solid rgba(183, 255, 108, 0.5);
        color: var(--lime);
        font-size: 12px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        font-weight: 700;
      }

      h1 {
        margin: 0 0 16px;
        font-size: clamp(2.8rem, 6vw, 6rem);
        line-height: 0.9;
        letter-spacing: -0.06em;
      }

      .accent {
        color: var(--pink);
        text-shadow: 0 0 18px rgba(255, 122, 217, 0.8);
      }

      .subtitle {
        max-width: 580px;
        font-size: 1.08rem;
        line-height: 1.7;
        opacity: 0.85;
      }

      .cta-row {
        display: flex;
        gap: 16px;
        flex-wrap: wrap;
        margin-top: 26px;
      }

      .button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 14px 22px;
        border-radius: 999px;
        text-decoration: none;
        font-weight: 700;
        transition: transform 0.2s ease, box-shadow 0.2s ease;
      }

      .button:hover {
        transform: translateY(-2px);
      }

      .primary {
        background: linear-gradient(135deg, var(--pink), var(--purple));
        color: white;
        box-shadow: 0 16px 32px rgba(255, 122, 217, 0.35);
      }

      .secondary {
        background: rgba(255,255,255,0.04);
        border: 1px solid rgba(255,255,255,0.14);
        color: var(--text);
      }

      .meme {
        position: absolute;
        right: -18px;
        bottom: -12px;
        width: min(34vw, 240px);
        min-width: 160px;
        padding: 18px 18px 12px;
        background: rgba(10, 8, 15, 0.46);
        border: 1px solid rgba(255,255,255,0.14);
        border-radius: 18px;
        transform: rotate(8deg);
        box-shadow: 0 18px 40px rgba(0,0,0,0.4);
      }

      .meme .eyes {
        display: flex;
        justify-content: space-between;
        margin-bottom: 10px;
      }

      .eye {
        width: 42px;
        height: 42px;
        background: #fff;
        border-radius: 50%;
        position: relative;
      }

      .eye::after {
        content: "";
        position: absolute;
        width: 16px;
        height: 16px;
        background: #111;
        border-radius: 50%;
        top: 12px;
        left: 13px;
      }

      .meme .mouth {
        width: 100%;
        height: 42px;
        border-bottom: 6px solid var(--cyan);
        border-radius: 0 0 50px 50px;
      }

      .meme .caption {
        margin-top: 10px;
        text-align: center;
        font-size: 0.75rem;
        text-transform: uppercase;
        letter-spacing: 0.14em;
        color: var(--lime);
      }

      @media (max-width: 720px) {
        .scene {
          padding: 22px 20px 120px;
        }

        .meme {
          position: static;
          width: 100%;
          max-width: 220px;
          margin: 18px auto 0;
          transform: rotate(0deg);
        }
      }
    </style>
  </head>
  <body>
    <main class="scene">
      <div class="badge">rot meme approved</div>
      <h1>what are you <span class="accent">doin</span> here?</h1>
      <p class="subtitle">
        This repo is basically a visual confession: HTML, CSS, and just enough chaos to look
        intentionally weird. It is stylish, it is silly, and absolutely no one asked for it to be
        this clean.
      </p>

      <div class="cta-row">
        <a class="button primary" href="#">Enter the nonsense</a>
        <a class="button secondary" href="#">Look at the junk</a>
      </div>

      <div class="meme" aria-label="meme face">
        <div class="eyes">
          <div class="eye"></div>
          <div class="eye"></div>
        </div>
        <div class="mouth"></div>
        <div class="caption">cozy chaos</div>
      </div>
    </main>
  </body>
</html>
